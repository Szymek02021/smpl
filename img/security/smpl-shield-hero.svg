<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 264" width="240" height="264" fill="none">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.52"/>
      <stop offset="52%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outerArmor" x1="24" y1="16" x2="216" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="28%" stop-color="#34D399"/>
      <stop offset="68%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="innerChamber" x1="120" y1="26" x2="120" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="55%" stop-color="#07101E"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="emeraldCore" x1="72" y1="64" x2="170" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="checkBeam" x1="88" y1="108" x2="158" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <clipPath id="chamberClip">
      <path d="M120 26L198 56V128C198 181 164 218 120 238C76 218 42 181 42 128V56L120 26Z"/>
    </clipPath>
    <filter id="neonDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Esport Stadium Glow -->
  <circle cx="120" cy="130" r="114" fill="url(#heroGlow)"/>

  <!-- Outer Precision Tech Ring -->
  <circle cx="120" cy="130" r="102" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="5 5"/>
  <circle cx="120" cy="130" r="94" stroke="#10B981" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Outer Armored Shield Bevel -->
  <path d="M120 14L210 49V129C210 189 171 230 120 252C69 230 30 189 30 129V49L120 14Z" fill="#060D1A" stroke="url(#outerArmor)" stroke-width="3.2"/>
  <path d="M120 21L203 53.5V128.5C203 184.5 167 222.5 120 243.5C73 222.5 37 184.5 37 128.5V53.5L120 21Z" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1"/>

  <!-- Inner Cyber-Stadium Chamber -->
  <g clip-path="url(#chamberClip)">
    <path d="M120 26L198 56V128C198 181 164 218 120 238C76 218 42 181 42 128V56L120 26Z" fill="url(#innerChamber)"/>

    <!-- Subtle Cyber-Stadium Grid & Pitch Geometry -->
    <g stroke="#22D3EE" stroke-opacity="0.14" stroke-width="1">
      <line x1="40" y1="76" x2="200" y2="76"/>
      <line x1="40" y1="104" x2="200" y2="104"/>
      <line x1="40" y1="132" x2="200" y2="132"/>
      <line x1="40" y1="160" x2="200" y2="160"/>
      <line x1="40" y1="188" x2="200" y2="188"/>
      <line x1="68" y1="26" x2="52" y2="240"/>
      <line x1="94" y1="26" x2="86" y2="240"/>
      <line x1="120" y1="26" x2="120" y2="240"/>
      <line x1="146" y1="26" x2="154" y2="240"/>
      <line x1="172" y1="26" x2="188" y2="240"/>
    </g>
    <!-- Pitch Center Circle & Spotlight Cone -->
    <circle cx="120" cy="132" r="54" stroke="#34D399" stroke-opacity="0.2" stroke-width="1.2"/>
    <path d="M120 26L198 56V110L42 155V56L120 26Z" fill="#34D399" fill-opacity="0.06"/>
  </g>

  <!-- Inner Neon Emerald Shield Core -->
  <path d="M120 52L174 73V126C174 164 150 191 120 206C90 191 66 164 66 126V73L120 52Z" fill="#042F2E" fill-opacity="0.72" stroke="url(#emeraldCore)" stroke-width="2.6" filter="url(#neonDrop)"/>
  <path d="M120 60L166 78V125C166 158 145 182 120 196C95 182 74 158 74 125V78L120 60Z" fill="url(#emeraldCore)" fill-opacity="0.18" stroke="#A7F3D0" stroke-opacity="0.38" stroke-width="1"/>

  <!-- Top Esport Crown Accent -->
  <path d="M104 44L112 36L120 43L128 36L136 44L132 50H108L104 44Z" fill="#FBBF24"/>

  <!-- Geometric Verification Checkmark -->
  <path d="M92 129L111 148L151 106" stroke="url(#checkBeam)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonDrop)"/>
  <path d="M92 129L111 148L151 106" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Corner Tech Nodes -->
  <circle cx="48" cy="62" r="3" fill="#34D399"/>
  <circle cx="192" cy="62" r="3" fill="#22D3EE"/>
  <circle cx="120" cy="228" r="3.5" fill="#FBBF24"/>
</svg>
